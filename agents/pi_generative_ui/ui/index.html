<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generative UI Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>GENERATIVE<span> UI</span></h1>
      <span id="status-dot" class="status-dot disconnected"></span>
    </header>

    <main id="chat"></main>

    <form id="composer">
      <textarea id="input" placeholder="TYPE YOUR REQUEST" rows="1"></textarea>
      <button type="submit">SEND</button>
    </form>
  </div>

  <!-- type="module" enables ES module import/export (app.js imports widgets.js) -->
  <script type="module" src="app.js"></script>
</body>
</html>
