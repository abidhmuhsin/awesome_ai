<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0f0f0f;
      --surface:      #1a1a1a;
      --text:         #ffffff;
      --text-muted:   #666666;
      --accent:       #ff4d4d;
      --accent-hover: #ff2020;
      --white-bg:     #f5f5f5;
      --dark-text:    #111111;
      --border:       rgba(255,255,255,0.08);
      --shadow-hard:  4px 4px 0 rgba(255,77,77,0.3);
      --shadow-hard-hover: 6px 6px 0 rgba(255,77,77,0.5);
      --user-bg:      #ff4d4d;
      --agent-bg:     #1a1a1a;
      --error-bg:     #8b0000;
      --radius:       4px;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body:    'Barlow', sans-serif;
      --transition:   0.25s ease-out;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font-body);
      font-weight: 400;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ── Watermark background ─────────────────────────────────────── */
    .watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font-display);
      font-size: 12rem;
      text-transform: uppercase;
      color: var(--text);
      opacity: 0.03;
      white-space: nowrap;
      pointer-events: none;
      z-index: 0;
      user-select: none;
    }

    /* ── Vertical accent stripe ───────────────────────────────────── */
    .accent-stripe {
      position: fixed;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--accent);
      z-index: 100;
    }

    /* ── Header ───────────────────────────────────────────────────── */
    header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--bg);
      position: relative;
      z-index: 10;
      animation: slideIn 0.5s ease-out forwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    header .logo {
      font-family: var(--font-display);
      font-size: 1.8rem;
      letter-spacing: 0.04em;
      color: var(--accent);
    }

    header h1 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 400;
    }

    header .status {
      margin-left: auto;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header .dot {
      width: 8px; height: 8px;
      border-radius: 2px;
      background: var(--text-muted);
      transition: all var(--transition);
    }

    header .dot.connected {
      background: #22c55e;
      box-shadow: 0 0 0 2px rgba(34,197,94,0.3);
    }

    /* ── Chat area ────────────────────────────────────────────────── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
      padding-left: 44px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 5;
    }

    #chat::-webkit-scrollbar {
      width: 4px;
    }

    #chat::-webkit-scrollbar-track {
      background: transparent;
    }

    #chat::-webkit-scrollbar-thumb {
      background: var(--text-muted);
    }

    .msg {
      max-width: 720px;
      width: fit-content;
      padding: 14px 18px;
      border-radius: var(--radius);
      line-height: 1.65;
      font-size: 0.95rem;
      font-weight: 400;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: messageIn 0.5s ease-out forwards;
      opacity: 0;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: var(--text);
      font-weight: 600;
      border-bottom-right-radius: 0;
      box-shadow: var(--shadow-hard);
    }

    .msg.agent {
      align-self: flex-start;
      background: var(--agent-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 0;
    }

    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      padding: 12px 0;
    }

    .msg.error {
      align-self: center;
      background: var(--error-bg);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(255,77,77,0.3);
    }

    /* ── Input bar ────────────────────────────────────────────────── */
    #input-bar {
      padding: 20px 32px;
      padding-left: 44px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      gap: 16px;
      align-items: flex-end;
      position: relative;
      z-index: 10;
      animation: slideIn 0.5s ease-out 0.1s forwards;
      opacity: 0;
    }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid #333;
      border-radius: 0;
      color: var(--text);
      padding: 12px 4px;
      font-size: 0.95rem;
      font-family: var(--font-body);
      font-weight: 400;
      resize: none;
      min-height: 48px;
      max-height: 160px;
      outline: none;
      transition: all var(--transition);
    }

    #input:focus {
      border-bottom-color: var(--accent);
    }

    #input::placeholder { 
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.85rem;
    }

    #send {
      background: var(--accent);
      color: var(--dark-text);
      border: none;
      border-radius: var(--radius);
      padding: 12px 28px;
      font-size: 1rem;
      font-family: var(--font-display);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      box-shadow: var(--shadow-hard);
    }

    #send:hover {
      background: var(--accent-hover);
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-hard-hover);
    }

    #send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ── Typing indicator ─────────────────────────────────────────── */
    .typing {
      display: inline-flex;
      gap: 8px;
      padding: 14px 18px;
      background: var(--agent-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 0;
      align-self: flex-start;
      animation: messageIn 0.25s ease-out forwards;
    }

    .typing span {
      width: 10px; height: 10px;
      border-radius: 2px;
      background: var(--accent);
      animation: pulse 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1); }
    }

    /* ── Grid lines (optional background) ─────────────────────────── */
    .grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    /* ── Diagonal crop decoration ─────────────────────────────────── */
    .diagonal-top {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 300px;
      height: 150px;
      background: var(--surface);
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
      opacity: 0.5;
      z-index: 0;
    }
  </style>
</head>
<body>

  <!-- Background elements -->
  <div class="accent-stripe"></div>
  <div class="watermark">AGENT</div>
  <div class="grid-bg"></div>
  <div class="diagonal-top"></div>

  <header>
    <span class="logo">V</span>
    <h1>Agent</h1>
    <div class="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Connecting…</span>
    </div>
  </header>

  <div id="chat"></div>

  <form id="input-bar" autocomplete="off">
    <textarea id="input" rows="1" placeholder="TYPE SOMETHING…" autofocus></textarea>
    <button id="send" type="submit">SEND</button>
  </form>

  <script>
    // ── DOM refs ──────────────────────────────────────────────────
    const chatEl   = document.getElementById('chat')
    const inputEl  = document.getElementById('input')
    const sendBtn  = document.getElementById('send')
    const dotEl    = document.getElementById('status-dot')
    const statusEl = document.getElementById('status-text')

    // ── WebSocket ─────────────────────────────────────────────────
    const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:'
    let ws

    function connect() {
      ws = new WebSocket(`${wsProto}//${location.host}/ws`)

      ws.addEventListener('open', () => {
        dotEl.classList.add('connected')
        statusEl.textContent = 'ONLINE'
        sendBtn.disabled = false
      })

      ws.addEventListener('close', () => {
        dotEl.classList.remove('connected')
        statusEl.textContent = 'OFFLINE'
        sendBtn.disabled = true
        setTimeout(connect, 2000)
      })

      ws.addEventListener('error', () => {
        ws.close()
      })

      ws.addEventListener('message', (evt) => {
        const msg = JSON.parse(evt.data)
        
        // Show typing indicator when agent starts processing
        if (msg.type === 'typing') {
          showTyping()
          return
        }
        
        removeTyping()
        appendMessage(msg.type, msg.text)
      })
    }

    connect()

    // ── Messages ──────────────────────────────────────────────────
    function appendMessage(type, text) {
      const el = document.createElement('div')
      el.classList.add('msg', type)
      el.textContent = text
      chatEl.appendChild(el)
      chatEl.scrollTop = chatEl.scrollHeight
    }

    function showTyping() {
      removeTyping()
      const el = document.createElement('div')
      el.classList.add('typing')
      el.id = 'typing'
      el.innerHTML = '<span></span><span></span><span></span>'
      chatEl.appendChild(el)
      chatEl.scrollTop = chatEl.scrollHeight
    }

    function removeTyping() {
      const el = document.getElementById('typing')
      if (el) el.remove()
    }

    // ── Input handling ────────────────────────────────────────────
    function sendMessage() {
      const text = inputEl.value.trim()
      if (!text || ws.readyState !== WebSocket.OPEN) return
      ws.send(text)
      showTyping()
      inputEl.value = ''
      autoResize()
    }

    sendBtn.addEventListener('click', sendMessage)

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault()
        sendMessage()
      }
    })

    // Auto-resize textarea
    function autoResize() {
      inputEl.style.height = 'auto'
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px'
    }
    inputEl.addEventListener('input', autoResize)
  </script>

</body>
</html>
