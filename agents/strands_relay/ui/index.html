<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Agent</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --text:      #e4e4e7;
      --muted:     #71717a;
      --accent:    #6366f1;
      --accent-h:  #818cf8;
      --user-bg:   #6366f1;
      --agent-bg:  #1e2030;
      --error-bg:  #7f1d1d;
      --radius:    12px;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────────────────── */
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
    }
    header .logo { font-size: 1.5rem; }
    header h1   { font-size: 1.1rem; font-weight: 600; }
    header .status {
      margin-left: auto;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    header .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.3s;
    }
    header .dot.connected { background: #22c55e; }

    /* ── Chat area ────────────────────────────────────────────────── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 720px;
      width: fit-content;
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.55;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: fade 0.25s ease;
    }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.agent {
      align-self: flex-start;
      background: var(--agent-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      padding: 4px 0;
    }
    .msg.error {
      align-self: center;
      background: var(--error-bg);
      color: #fca5a5;
      font-size: 0.85rem;
    }

    /* ── Input bar ────────────────────────────────────────────────── */
    #input-bar {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 12px 16px;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      min-height: 48px;
      max-height: 160px;
      outline: none;
      transition: border-color 0.2s;
    }
    #input:focus { border-color: var(--accent); }
    #input::placeholder { color: var(--muted); }

    #send {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    #send:hover       { background: var(--accent-h); }
    #send:disabled     { opacity: 0.5; cursor: not-allowed; }

    /* ── Typing indicator ─────────────────────────────────────────── */
    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 12px 16px;
      background: var(--agent-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      align-self: flex-start;
    }
    .typing span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.4s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

  <header>
    <span class="logo">🤖</span>
    <h1>Visual Agent</h1>
    <div class="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Connecting…</span>
    </div>
  </header>

  <div id="chat"></div>

  <form id="input-bar" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Type a message…" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    // ── DOM refs ──────────────────────────────────────────────────
    const chatEl   = document.getElementById('chat')
    const inputEl  = document.getElementById('input')
    const sendBtn  = document.getElementById('send')
    const dotEl    = document.getElementById('status-dot')
    const statusEl = document.getElementById('status-text')

    // ── WebSocket ─────────────────────────────────────────────────
    const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:'
    let ws

    function connect() {
      ws = new WebSocket(`${wsProto}//${location.host}/ws`)

      ws.addEventListener('open', () => {
        dotEl.classList.add('connected')
        statusEl.textContent = 'Connected'
        sendBtn.disabled = false
      })

      ws.addEventListener('close', () => {
        dotEl.classList.remove('connected')
        statusEl.textContent = 'Disconnected – reconnecting…'
        sendBtn.disabled = true
        setTimeout(connect, 2000)
      })

      ws.addEventListener('error', () => {
        ws.close()
      })

      ws.addEventListener('message', (evt) => {
        removeTyping()
        const msg = JSON.parse(evt.data)
        appendMessage(msg.type, msg.text)
      })
    }

    connect()

    // ── Messages ──────────────────────────────────────────────────
    function appendMessage(type, text) {
      const el = document.createElement('div')
      el.classList.add('msg', type)
      el.textContent = text
      chatEl.appendChild(el)
      chatEl.scrollTop = chatEl.scrollHeight
    }

    function showTyping() {
      removeTyping()
      const el = document.createElement('div')
      el.classList.add('typing')
      el.id = 'typing'
      el.innerHTML = '<span></span><span></span><span></span>'
      chatEl.appendChild(el)
      chatEl.scrollTop = chatEl.scrollHeight
    }

    function removeTyping() {
      const el = document.getElementById('typing')
      if (el) el.remove()
    }

    // ── Input handling ────────────────────────────────────────────
    function sendMessage() {
      const text = inputEl.value.trim()
      if (!text || ws.readyState !== WebSocket.OPEN) return
      ws.send(text)
      showTyping()
      inputEl.value = ''
      autoResize()
    }

    sendBtn.addEventListener('click', sendMessage)

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault()
        sendMessage()
      }
    })

    // Auto-resize textarea
    function autoResize() {
      inputEl.style.height = 'auto'
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px'
    }
    inputEl.addEventListener('input', autoResize)
  </script>

</body>
</html>
