<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0f0f0f;
      --surface:      #1a1a1a;
      --text:         #ffffff;
      --text-muted:   #666666;
      --accent:       #ff4d4d;
      --accent-hover: #ff2020;
      --white-bg:     #f5f5f5;
      --dark-text:    #111111;
      --border:       rgba(255,255,255,0.08);
      --shadow-hard:  4px 4px 0 rgba(255,77,77,0.3);
      --shadow-hard-hover: 6px 6px 0 rgba(255,77,77,0.5);
      --user-bg:      #ff4d4d;
      --agent-bg:     #1a1a1a;
      --error-bg:     #8b0000;
      --radius:       4px;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body:    'Barlow', sans-serif;
      --transition:   0.25s ease-out;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font-body);
      font-weight: 400;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ── Watermark background ─────────────────────────────────────── */
    .watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font-display);
      font-size: 12rem;
      text-transform: uppercase;
      color: var(--text);
      opacity: 0.03;
      white-space: nowrap;
      pointer-events: none;
      z-index: 0;
      user-select: none;
    }

    /* ── Vertical accent stripe ───────────────────────────────────── */
    .accent-stripe {
      position: fixed;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--accent);
      z-index: 100;
    }

    /* ── Header ───────────────────────────────────────────────────── */
    header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--bg);
      position: relative;
      z-index: 10;
      animation: slideIn 0.5s ease-out forwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    header .logo {
      font-family: var(--font-display);
      font-size: 1.8rem;
      letter-spacing: 0.04em;
      color: var(--accent);
    }

    header h1 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 400;
    }

    header .status {
      margin-left: auto;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header .dot {
      width: 8px; height: 8px;
      border-radius: 2px;
      background: var(--text-muted);
      transition: all var(--transition);
    }

    header .dot.connected {
      background: #22c55e;
      box-shadow: 0 0 0 2px rgba(34,197,94,0.3);
    }

    /* ── Chat area ────────────────────────────────────────────────── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
      padding-left: 44px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 5;
    }

    #chat::-webkit-scrollbar {
      width: 4px;
    }

    #chat::-webkit-scrollbar-track {
      background: transparent;
    }

    #chat::-webkit-scrollbar-thumb {
      background: var(--text-muted);
    }

    .msg {
      max-width: 720px;
      width: fit-content;
      padding: 14px 18px;
      border-radius: var(--radius);
      line-height: 1.65;
      font-size: 0.95rem;
      font-weight: 400;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: messageIn 0.5s ease-out forwards;
      opacity: 0;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: var(--text);
      font-weight: 600;
      border-bottom-right-radius: 0;
      box-shadow: var(--shadow-hard);
    }

    .msg.agent {
      align-self: flex-start;
      background: var(--agent-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 0;
    }

    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      padding: 12px 0;
    }

    .msg.error {
      align-self: center;
      background: var(--error-bg);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(255,77,77,0.3);
    }

    /* ── Copy button ──────────────────────────────────────────────── */
    .msg {
      position: relative;
    }

    .copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: var(--radius);
      background: rgba(255,255,255,0.08);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity var(--transition);
      z-index: 2;
    }

    .msg:hover .copy-btn {
      opacity: 1;
    }

    .copy-btn:hover {
      background: rgba(255,255,255,0.16);
    }

    .copy-btn svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .copy-btn:hover svg {
      stroke: var(--text);
    }

    .copy-btn.copied svg {
      stroke: #22c55e;
    }

    /* User copy button on darker bg needs lighter hover bg */
    .msg.user .copy-btn {
      background: rgba(0,0,0,0.15);
    }
    .msg.user .copy-btn:hover {
      background: rgba(0,0,0,0.3);
    }
    .msg.user .copy-btn svg {
      stroke: rgba(255,255,255,0.7);
    }
    .msg.user .copy-btn:hover svg {
      stroke: #fff;
    }

    /* ── Tool call cards (expandable) ────────────────────────────── */
    .toolcall {
      align-self: flex-start;
      max-width: 720px;
      width: 100%;
      background: rgba(255,77,77,0.04);
      border: 1px solid rgba(255,77,77,0.15);
      border-radius: var(--radius);
      overflow: visible;
      animation: toolcallFade 0.25s ease-out forwards;
      opacity: 0;
    }

    @keyframes toolcallFade {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .toolcall-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      cursor: pointer;
      user-select: none;
      transition: background var(--transition);
    }

    .toolcall-header:hover {
      background: rgba(255,77,77,0.06);
    }

    .toolcall-icon {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .toolcall-icon svg {
      width: 14px;
      height: 14px;
    }

    /* Running spinner */
    .toolcall-icon.spin {
      animation: toolcallSpin 1s linear infinite;
    }

    @keyframes toolcallSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Checkmark (success) fill */
    .toolcall-icon.success svg {
      stroke: #22c55e;
    }

    .toolcall-icon.error svg {
      stroke: #ff4d4d;
    }

    .toolcall-name {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent);
      font-family: var(--font-body);
      flex-shrink: 0;
    }

    .toolcall-duration {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 400;
      font-family: monospace;
      margin-left: auto;
    }

    .toolcall-chevron {
      font-size: 0.6rem;
      color: var(--text-muted);
      transition: transform var(--transition);
      margin-left: 4px;
    }

    .toolcall-chevron.open {
      transform: rotate(90deg);
    }

    .toolcall-body {
      display: none;
      padding: 10px 14px 14px 14px;
      border-top: 1px solid rgba(255,77,77,0.08);
      font-family: monospace;
      font-size: 0.72rem;
      line-height: 1.6;
      color: rgba(255,255,255,0.7);
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 40vh;
      overflow-y: auto;
    }

    .toolcall-body.open {
      display: block;
    }

    .toolcall-body::-webkit-scrollbar {
      width: 3px;
    }

    .toolcall-body::-webkit-scrollbar-thumb {
      background: rgba(255,77,77,0.3);
      border-radius: 2px;
    }

    .toolcall-body .toolcall-label {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .toolcall-body .toolcall-args {
      margin-bottom: 10px;
      padding: 6px 8px;
      background: rgba(0,0,0,0.2);
      border-radius: 3px;
      font-size: 0.68rem;
      line-height: 1.5;
      color: rgba(255,255,255,0.6);
    }

    .toolcall-body .toolcall-result {
      padding: 6px 8px;
      background: rgba(0,0,0,0.2);
      border-radius: 3px;
      font-size: 0.68rem;
      line-height: 1.5;
      color: rgba(255,255,255,0.5);
      max-height: 200px;
      overflow-y: auto;
    }

    .toolcall-body .toolcall-result.error {
      color: #ff6b6b;
    }

    /* ── Input bar ────────────────────────────────────────────────── */
    #input-bar {
      padding: 20px 32px;
      padding-left: 44px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      gap: 16px;
      align-items: flex-end;
      position: relative;
      z-index: 10;
      animation: slideIn 0.5s ease-out 0.1s forwards;
      opacity: 0;
    }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid #333;
      border-radius: 0;
      color: var(--text);
      padding: 12px 4px;
      font-size: 0.95rem;
      font-family: var(--font-body);
      font-weight: 400;
      resize: none;
      min-height: 48px;
      max-height: 160px;
      outline: none;
      transition: all var(--transition);
    }

    #input:focus {
      border-bottom-color: var(--accent);
    }

    #input::placeholder { 
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.85rem;
    }

    #send {
      background: var(--accent);
      color: var(--dark-text);
      border: none;
      border-radius: var(--radius);
      padding: 12px 28px;
      font-size: 1rem;
      font-family: var(--font-display);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      box-shadow: var(--shadow-hard);
    }

    #send:hover {
      background: var(--accent-hover);
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-hard-hover);
    }

    #send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ── Typing indicator ─────────────────────────────────────────── */
    .typing {
      display: inline-flex;
      gap: 8px;
      padding: 14px 18px;
      background: var(--agent-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 0;
      align-self: flex-start;
      animation: messageIn 0.25s ease-out forwards;
    }

    .typing span {
      width: 10px; height: 10px;
      border-radius: 2px;
      background: var(--accent);
      animation: pulse 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1); }
    }

    /* ── Grid lines (optional background) ─────────────────────────── */
    .grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    /* ── Widget card ───────────────────────────────────────────────── */
    .widget-card {
      align-self: flex-start;
      max-width: 720px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: visible;
      animation: messageIn 0.5s ease-out forwards;
      opacity: 0;
    }

    .widget-title {
      padding: 8px 14px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    .widget-body {
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .widget-body > * {
      max-width: 100%;
    }

    .widget-body svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ── Diagonal crop decoration ─────────────────────────────────── */
    .diagonal-top {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 300px;
      height: 150px;
      background: var(--surface);
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
      opacity: 0.5;
      z-index: 0;
    }
  </style>
</head>
<body>

  <!-- Background elements -->
  <div class="accent-stripe"></div>
  <div class="watermark">AGENT</div>
  <div class="grid-bg"></div>
  <div class="diagonal-top"></div>

  <header>
    <span class="logo">V</span>
    <h1>Agent</h1>
    <div class="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Connecting…</span>
    </div>
  </header>

  <div id="chat"></div>

  <form id="input-bar" autocomplete="off">
    <textarea id="input" rows="1" placeholder="TYPE SOMETHING…" autofocus></textarea>
    <button id="send" type="submit">SEND</button>
  </form>

  <script>
    // ── DOM refs ──────────────────────────────────────────────────
    const chatEl   = document.getElementById('chat')
    const inputEl  = document.getElementById('input')
    const sendBtn  = document.getElementById('send')
    const dotEl    = document.getElementById('status-dot')
    const statusEl = document.getElementById('status-text')

    // ── WebSocket ─────────────────────────────────────────────────
    const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:'
    let ws

    function connect() {
      ws = new WebSocket(`${wsProto}//${location.host}/ws`)

      ws.addEventListener('open', () => {
        dotEl.classList.add('connected')
        statusEl.textContent = 'ONLINE'
        sendBtn.disabled = false
      })

      ws.addEventListener('close', () => {
        dotEl.classList.remove('connected')
        statusEl.textContent = 'OFFLINE'
        sendBtn.disabled = true
        setTimeout(connect, 2000)
      })

      ws.addEventListener('error', () => {
        ws.close()
      })

      // Track active tool call elements by id
      const toolEls = new Map()

      ws.addEventListener('message', (evt) => {
        const msg = JSON.parse(evt.data)

        if (msg.type === 'tool_start') {
          removeTyping()
          toolEls.set(msg.id, appendToolCallStart(msg.id, msg.name, msg.args))
          return
        }

        if (msg.type === 'tool_end') {
          const el = toolEls.get(msg.id)
          if (el) appendToolCallEnd(el, msg)
          toolEls.delete(msg.id)
          return
        }

        // Show typing indicator when agent starts processing
        if (msg.type === 'typing') {
          showTyping()
          return
        }

        removeTyping()

        if (msg.type === 'widget') {
          appendWidget(msg.title, msg.widget_code)
        } else {
          appendMessage(msg.type, msg.text)
        }
      })
    }

    connect()

    // ── Messages ──────────────────────────────────────────────────
    function appendToolCallStart(id, name, args) {
      const card = document.createElement('div')
      card.classList.add('toolcall')
      card.dataset.toolId = id
      card.style.animationDelay = '0s'

      // Header (always visible)
      const header = document.createElement('div')
      header.classList.add('toolcall-header')

      const icon = document.createElement('span')
      icon.classList.add('toolcall-icon', 'spin')
      icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>`
      header.appendChild(icon)

      const nameEl = document.createElement('span')
      nameEl.classList.add('toolcall-name')
      nameEl.textContent = name
      header.appendChild(nameEl)

      const durationEl = document.createElement('span')
      durationEl.classList.add('toolcall-duration')
      durationEl.textContent = 'running…'
      header.appendChild(durationEl)

      const chevron = document.createElement('span')
      chevron.classList.add('toolcall-chevron')
      chevron.textContent = '▸'
      header.appendChild(chevron)

      card.appendChild(header)

      // Body (expandable — hidden by default)
      const body = document.createElement('div')
      body.classList.add('toolcall-body')

      const label = document.createElement('div')
      label.classList.add('toolcall-label')
      label.textContent = 'Arguments'
      body.appendChild(label)

      const argsEl = document.createElement('div')
      argsEl.classList.add('toolcall-args')
      argsEl.textContent = args || '{}'
      body.appendChild(argsEl)

      card.appendChild(body)

      // Toggle expand on header click
      header.addEventListener('click', () => {
        body.classList.toggle('open')
        chevron.classList.toggle('open')
      })

      chatEl.appendChild(card)
      chatEl.scrollTop = chatEl.scrollHeight
      return card
    }

    function appendToolCallEnd(card, msg) {
      const icon = card.querySelector('.toolcall-icon')
      icon.classList.remove('spin')
      icon.classList.add(msg.status === 'error' ? 'error' : 'success')
      icon.innerHTML = msg.status === 'error'
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="16 10 11 15 8 12"/></svg>`

      const durationEl = card.querySelector('.toolcall-duration')
      const dur = msg.duration
      if (dur < 1000) durationEl.textContent = dur + 'ms'
      else durationEl.textContent = (dur / 1000).toFixed(1) + 's'

      // Add result section to body
      const body = card.querySelector('.toolcall-body')
      if (msg.result) {
        const resultLabel = document.createElement('div')
        resultLabel.classList.add('toolcall-label')
        resultLabel.textContent = 'Result'
        resultLabel.style.marginTop = '10px'
        body.appendChild(resultLabel)

        const resultEl = document.createElement('div')
        resultEl.classList.add('toolcall-result')
        if (msg.status === 'error') resultEl.classList.add('error')
        resultEl.textContent = msg.result.length > 500
          ? msg.result.slice(0, 500) + '…'
          : msg.result
        body.appendChild(resultEl)
      }
    }

    function appendMessage(type, text) {
      if (!text || !text.trim()) return

      const el = document.createElement('div')
      el.classList.add('msg', type)

      // Message text
      const textEl = document.createElement('div')
      textEl.textContent = text
      el.appendChild(textEl)

      // Copy button (inside the message bubble, top-right)
      if (type === 'user' || type === 'agent') {
        const btn = document.createElement('button')
        btn.classList.add('copy-btn')
        btn.title = 'Copy'
        btn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(el.textContent).then(() => {
            btn.classList.add('copied')
            btn.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`
            setTimeout(() => {
              btn.classList.remove('copied')
              btn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`
            }, 1500)
          })
        })
        el.appendChild(btn)
      }

      chatEl.appendChild(el)
      chatEl.scrollTop = chatEl.scrollHeight
    }

    function showTyping() {
      removeTyping()
      const el = document.createElement('div')
      el.classList.add('typing')
      el.id = 'typing'
      el.innerHTML = '<span></span><span></span><span></span>'
      chatEl.appendChild(el)
      chatEl.scrollTop = chatEl.scrollHeight
    }

    function removeTyping() {
      const el = document.getElementById('typing')
      if (el) el.remove()
    }

    function appendWidget(title, code) {
      const card = document.createElement('div')
      card.classList.add('widget-card')

      const titleEl = document.createElement('div')
      titleEl.classList.add('widget-title')
      titleEl.textContent = title
      card.appendChild(titleEl)

      const body = document.createElement('div')
      body.classList.add('widget-body')
      // TODO: XSS — innerHTML with untrusted LLM output. Use sandboxed iframe later.
      body.innerHTML = code
      card.appendChild(body)

      chatEl.appendChild(card)
      chatEl.scrollTop = chatEl.scrollHeight
    }

    // ── Input handling ────────────────────────────────────────────
    function sendMessage() {
      const text = inputEl.value.trim()
      if (!text || ws.readyState !== WebSocket.OPEN) return
      ws.send(text)
      showTyping()
      inputEl.value = ''
      autoResize()
    }

    sendBtn.addEventListener('click', sendMessage)

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault()
        sendMessage()
      }
    })

    // Auto-resize textarea
    function autoResize() {
      inputEl.style.height = 'auto'
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px'
    }
    inputEl.addEventListener('input', autoResize)
  </script>

</body>
</html>
